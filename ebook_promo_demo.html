<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SLX - O Princípio da Habilidade</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;700;900&display=swap" rel="stylesheet">
    <style>
        :root {
            --emerald: #10b981;
            --emerald-glow: rgba(16, 185, 129, 0.4);
            --bg-dark: #09090b;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Inter', sans-serif;
            background-color: var(--bg-dark);
            color: white;
            height: 200vh;
            overflow-x: hidden;
        }

        .site-mock {
            padding: 100px 50px;
            opacity: 0.1;
            pointer-events: none;
        }

        h1 {
            font-size: 4rem;
            font-weight: 900;
            letter-spacing: -2px;
            margin-bottom: 20px;
        }

        .grid {
            display: grid;
            grid-template-cols: repeat(3, 1fr);
            gap: 20px;
        }

        .card {
            height: 300px;
            background: #18181b;
            border-radius: 20px;
            border: 1px solid #27272a;
        }

        .ebook-nano-card {
            position: fixed;
            bottom: 30px;
            right: 30px;
            width: 350px;
            background: rgba(10, 10, 10, 0.8);
            backdrop-filter: blur(20px);
            border: 1px solid rgba(16, 185, 129, 0.3);
            border-radius: 28px;
            padding: 20px;
            display: flex;
            align-items: center;
            gap: 18px;
            box-shadow: 0 20px 50px rgba(0, 0, 0, 0.8);
            z-index: 1000;
            cursor: pointer;
            transition: all 0.5s cubic-bezier(0.19, 1, 0.22, 1);
            opacity: 0;
            transform: translateX(50px);
            animation: slideIn 1s 0.5s forwards, pulseGlow 4s infinite;
        }

        @keyframes slideIn {
            to {
                opacity: 1;
                transform: translateX(0);
            }
        }

        @keyframes pulseGlow {
            0% {
                box-shadow: 0 20px 50px rgba(0, 0, 0, 0.8), 0 0 0px rgba(16, 185, 129, 0);
            }

            50% {
                box-shadow: 0 20px 50px rgba(0, 0, 0, 0.8), 0 0 20px rgba(16, 185, 129, 0.15);
            }

            100% {
                box-shadow: 0 20px 50px rgba(0, 0, 0, 0.8), 0 0 0px rgba(16, 185, 129, 0);
            }
        }

        .ebook-nano-card:hover {
            transform: scale(1.03) translateY(-5px);
            border-color: var(--emerald);
            background: rgba(15, 15, 15, 0.95);
        }

        .ebook-visual {
            width: 70px;
            height: 95px;
            background: linear-gradient(135deg, #10b981 0%, #064e3b 100%);
            border-radius: 10px;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            position: relative;
            box-shadow: 10px 10px 25px rgba(0, 0, 0, 0.4);
            flex-shrink: 0;
            overflow: hidden;
            border-left: 3px solid rgba(255, 255, 255, 0.1);
        }

        .ebook-visual .shine {
            position: absolute;
            top: 0;
            left: -100%;
            width: 50%;
            height: 100%;
            background: linear-gradient(to right, transparent, rgba(255, 255, 255, 0.2), transparent);
            transform: skewX(-20deg);
            animation: shine 4s infinite;
        }

        @keyframes shine {

            10%,
            100% {
                left: 200%;
            }
        }

        .content {
            flex-grow: 1;
        }

        .tag-row {
            display: flex;
            align-items: center;
            gap: 6px;
            margin-bottom: 6px;
        }

        .status-dot {
            width: 6px;
            height: 6px;
            background: var(--emerald);
            border-radius: 50%;
            box-shadow: 0 0 8px var(--emerald);
        }

        .tag {
            font-size: 10px;
            font-weight: 800;
            text-transform: uppercase;
            color: var(--emerald);
            letter-spacing: 1px;
        }

        .title {
            font-size: 16px;
            font-weight: 900;
            color: white;
            line-height: 1.2;
            margin-bottom: 10px;
            letter-spacing: -0.5px;
        }

        .cta-row {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .price {
            font-size: 14px;
            font-weight: 700;
            color: rgba(255, 255, 255, 0.5);
            text-decoration: line-through;
        }

        .promo-price {
            font-size: 18px;
            font-weight: 900;
            color: white;
        }

        .close-btn {
            position: absolute;
            top: -10px;
            right: -10px;
            width: 28px;
            height: 28px;
            background: #18181b;
            border: 1px solid #27272a;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 16px;
            color: #52525b;
            transition: 0.3s;
            cursor: pointer;
        }

        .close-btn:hover {
            color: white;
            background: #ef4444;
            border-color: #ef4444;
            transform: scale(1.1);
        }
    </style>
</head>

<body>

    <div class="site-mock">
        <h1>SLX PLATFORM</h1>
        <div class="grid">
            <div class="card"></div>
            <div class="card"></div>
            <div class="card"></div>
        </div>
    </div>

    <!-- NANO CARD ATUALIZADO -->
    <div class="ebook-nano-card" onclick="window.open('https://pay.kiwify.com.br/25YEnTk', '_blank')">
        <div class="close-btn" onclick="event.stopPropagation(); this.parentElement.style.display='none'">×</div>

        <div class="ebook-visual">
            <div class="shine"></div>
            <div
                style="font-size: 7px; font-weight: 900; text-align: center; color: white; line-height: 1.1; padding: 5px;">
                O PRINCÍPIO DA HABILIDADE
            </div>
        </div>

        <div class="content">
            <div class="tag-row">
                <div class="status-dot"></div>
                <span class="tag">Manual Oficial SLX</span>
            </div>
            <div class="title">O Princípio da Habilidade</div>
            <div class="cta-row">
                <span class="price">R$ 97</span>
                <span class="promo-price">R$ 47,00</span>
                <div
                    style="margin-left: auto; width: 24px; height: 24px; background: white; border-radius: 50%; display: flex; align-items: center; justify-content: center;">
                    <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="black" stroke-width="4"
                        stroke-linecap="round" stroke-linejoin="round">
                        <path d="M5 12h14M12 5l7 7-7 7" />
                    </svg>
                </div>
            </div>
        </div>
    </div>

</body>

</html>
