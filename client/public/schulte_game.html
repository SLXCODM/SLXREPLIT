<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Schulte Pro - SLX Training</title>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;700;900&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary: #00f2ff;
            --primary-glow: rgba(0, 242, 255, 0.4);
            --bg: #0a0e14;
            --card-bg: #1a1f26;
            --text: #ffffff;
            --error: #ff4d4d;
            --success: #00ff88;
            --warning: #ffaa00;
            --font-main: 'Outfit', sans-serif;
        }

        /* --- SKINS --- */
        body.skin-diamond {
            --primary: #ffd700;
            --primary-glow: rgba(255, 215, 0, 0.7);
            background: radial-gradient(circle at 50% 50%, #1a1600 0%, #050505 100%);
        }

        body.skin-aether {
            --primary: #bf00ff;
            --primary-glow: rgba(191, 0, 255, 0.8);
            background: #0d001a;
        }

        body.skin-fairy {
            --primary: #ff003c;
            --primary-glow: rgba(255, 0, 60, 0.8);
            background: #0f0004;
        }

        /* MODO FUMAÇA (Smoke Screen) */
        .smoke-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: radial-gradient(circle at 50% 50%, transparent 5%, rgba(0, 0, 0, 0.95) 60%);
            pointer-events: none;
            z-index: 50;
            opacity: 0;
            transition: opacity 1.5s;
        }

        .smoke-particle {
            position: fixed;
            top: -50%;
            left: -50%;
            width: 200%;
            height: 200%;
            background-image: url('https://www.transparenttextures.com/patterns/black-linen.png');
            background-color: rgba(20, 20, 20, 0.8);
            mask-image: radial-gradient(circle, transparent 10%, black 50%);
            -webkit-mask-image: radial-gradient(circle, transparent 10%, black 50%);
            pointer-events: none;
            z-index: 49;
            opacity: 0;
            transition: opacity 2s;
        }

        body.smoke-active .smoke-overlay {
            opacity: 1;
            animation: smokePulse 5s infinite alternate ease-in-out;
        }

        body.smoke-active .smoke-particle {
            opacity: 1;
            animation: smokeDrift 20s infinite linear;
        }

        @keyframes smokePulse {
            0% {
                transform: scale(1);
                filter: blur(2px);
            }

            100% {
                transform: scale(1.15);
                filter: blur(10px);
            }
        }

        @keyframes smokeDrift {
            0% {
                transform: rotate(0deg) translate(0, 0);
            }

            100% {
                transform: rotate(360deg) translate(50px, 50px);
            }
        }

        /* MODO FLASH */
        .flash-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: #fff;
            pointer-events: none;
            z-index: 100;
            opacity: 0;
        }

        body.flash-active .flash-overlay {
            animation: flashEffect 4s infinite linear;
        }

        @keyframes flashEffect {

            0%,
            90% {
                opacity: 0;
            }

            93% {
                opacity: 0.8;
            }

            95% {
                opacity: 0;
            }

            97% {
                opacity: 0.5;
            }

            100% {
                opacity: 0;
            }
        }

        /* --- UI COMPONENTES --- */
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            user-select: none;
        }

        body {
            background-color: var(--bg);
            color: var(--text);
            font-family: var(--font-main);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: flex-start;
            height: 100vh;
            overflow: hidden;
            transition: 0.5s;
            padding: 20px;
        }

        .container {
            text-align: center;
            width: 100%;
            max-width: 900px;
            display: flex;
            flex-direction: column;
            height: 100%;
        }

        header {
            flex-shrink: 0;
            margin-bottom: 10px;
        }

        h1 {
            font-weight: 900;
            font-size: clamp(1.5rem, 4vw, 2.2rem);
            color: var(--primary);
            text-transform: uppercase;
            letter-spacing: -1px;
            text-shadow: 0 0 20px var(--primary-glow);
        }

        .nav-top {
            position: absolute;
            top: 20px;
            left: 20px;
            z-index: 100;
        }

        .btn-back {
            background: rgba(255, 255, 255, 0.1);
            color: #fff;
            border: none;
            padding: 8px 15px;
            border-radius: 8px;
            cursor: pointer;
            font-family: var(--font-main);
            font-weight: 700;
            text-decoration: none;
            font-size: 0.8rem;
        }

        .selectors {
            display: flex;
            flex-direction: column;
            gap: 8px;
            margin-bottom: 15px;
        }

        .label-group {
            font-size: 0.6rem;
            color: #555;
            text-transform: uppercase;
            font-weight: 700;
        }

        .selector-group {
            display: flex;
            justify-content: center;
            gap: 6px;
            flex-wrap: wrap;
        }

        .btn-ui {
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 255, 255, 0.1);
            color: #888;
            padding: 5px 12px;
            border-radius: 6px;
            cursor: pointer;
            transition: 0.2s;
            font-size: 0.7rem;
            font-weight: 700;
            text-transform: uppercase;
        }

        .btn-ui.active {
            background: var(--primary);
            color: #000;
            border-color: var(--primary);
            box-shadow: 0 0 10px var(--primary-glow);
        }

        .btn-ui.locked {
            opacity: 0.6;
        }

        .btn-ui.locked::after {
            content: ' 🔒';
            font-size: 0.6rem;
        }

        .stats-bar {
            display: flex;
            justify-content: space-around;
            margin-bottom: 15px;
            background: rgba(255, 255, 255, 0.03);
            padding: 10px;
            border-radius: 12px;
            border: 1px solid rgba(255, 255, 255, 0.08);
            flex-shrink: 0;
        }

        .stat-item {
            text-align: center;
        }

        .stat-val {
            font-size: 1.2rem;
            font-weight: 900;
        }

        .grid-container {
            flex-grow: 1;
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 0;
            width: 100%;
            padding: 10px;
        }

        .grid {
            display: grid;
            gap: 5px;
            padding: 10px;
            border-radius: 12px;
            background: rgba(0, 0, 0, 0.3);
            margin: 0 auto;
            max-width: 100%;
            max-height: 100%;
            aspect-ratio: 1;
        }

        .cell {
            background: var(--card-bg);
            border: 1px solid rgba(255, 255, 255, 0.03);
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: 900;
            cursor: pointer;
            border-radius: 4px;
            transition: 0.1s;
            color: rgba(255, 255, 255, 0.7);
            font-size: clamp(0.6rem, 2vw, 1.5rem);
        }

        .cell:hover {
            border-color: var(--primary);
            transform: scale(1.05);
            z-index: 5;
        }

        .cell.correct {
            background: var(--primary);
            color: #000;
            box-shadow: 0 0 15px var(--primary-glow);
            border: none;
        }

        .cell.wrong {
            background: var(--error);
            animation: shake 0.3s;
        }

        @keyframes shake {

            0%,
            100% {
                transform: translateX(0)
            }

            25% {
                transform: translateX(-3px)
            }

            75% {
                transform: translateX(3px)
            }
        }

        .footer-btns {
            flex-shrink: 0;
            padding: 20px 0;
            display: flex;
            gap: 10px;
            justify-content: center;
        }

        .btn-main {
            background: var(--primary);
            color: #000;
            border: none;
            padding: 14px 40px;
            font-size: 1rem;
            font-weight: 900;
            border-radius: 8px;
            cursor: pointer;
            text-transform: uppercase;
            transition: 0.2s;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .btn-reset {
            background: rgba(255, 77, 77, 0.15);
            color: #ff4d4d;
            border: 1px solid rgba(255, 77, 77, 0.3);
            display: none;
            padding: 14px 25px;
        }

        .btn-restart-icon {
            width: 18px;
            height: 18px;
            border: 2px solid currentColor;
            border-right-color: transparent;
            border-radius: 50%;
            position: relative;
        }

        .btn-restart-icon::after {
            content: '';
            position: absolute;
            top: -4px;
            right: -4px;
            border: 5px solid transparent;
            border-top-color: currentColor;
            transform: rotate(45deg);
        }

        .overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(5, 7, 10, 0.98);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: flex-start;
            z-index: 200;
            display: none;
            padding: 60px 20px;
            text-align: center;
            overflow-y: auto;
        }

        .support-card {
            margin-top: 30px;
            padding: 25px;
            border-radius: 15px;
            background: rgba(255, 255, 255, 0.03);
            border: 1px solid rgba(255, 255, 255, 0.1);
            max-width: 450px;
        }

        #timer-display.warning {
            color: var(--error);
            animation: blink 0.5s infinite;
        }

        @keyframes blink {
            50% {
                opacity: 0.5;
            }
        }

        .grid-3 {
            grid-template-columns: repeat(3, 1fr);
            height: min(60vh, 60vw);
            width: min(60vh, 60vw);
        }

        .grid-5 {
            grid-template-columns: repeat(5, 1fr);
            height: min(65vh, 65vw);
            width: min(65vh, 65vw);
        }

        .grid-7 {
            grid-template-columns: repeat(7, 1fr);
            height: min(70vh, 70vw);
            width: min(70vh, 70vw);
        }

        .grid-9 {
            grid-template-columns: repeat(9, 1fr);
            height: min(75vh, 75vw);
            width: min(75vh, 75vw);
        }

        .grid-11 {
            grid-template-columns: repeat(11, 1fr);
            height: min(80vh, 80vw);
            width: min(80vh, 80vw);
        }
    </style>
</head>

<body>

    <div class="smoke-overlay"></div>
    <div class="smoke-particle"></div>
    <div class="flash-overlay"></div>
    <div class="nav-top">
        <a href="/" id="btn-nav-home" class="btn-back" style="margin-right: 10px;">🏠 Home</a>
        <a href="training_hub.html" id="btn-nav-hub" class="btn-back">← Hub</a>
    </div>

    <div class="container">
        <header>
            <h1 data-i18n="title">Schulte Challenge</h1>
        </header>

        <div class="selectors">
            <div class="label-group" data-i18n="operation">Operação</div>
            <div class="selector-group">
                <button class="btn-ui diff-btn" onclick="setDiff(3, this)">3x3</button>
                <button class="btn-ui diff-btn active" onclick="setDiff(5, this)">5x5</button>
                <button class="btn-ui diff-btn locked" id="lock-7" onclick="tryUnlock(7, this)">7x7</button>
                <button class="btn-ui diff-btn locked" id="lock-9" onclick="tryUnlock(9, this)">9x9</button>
                <button class="btn-ui diff-btn locked" id="lock-11" onclick="tryUnlock(11, this)">11x11</button>
            </div>
            <div class="selector-group">
                <button class="btn-ui" id="smoke-btn" onclick="toggleSmoke(this)" data-i18n="smokeMode">Modo Smoke:
                    OFF</button>
                <button class="btn-ui" id="flash-btn" onclick="toggleFlash(this)" data-i18n="flashMode">Modo Flash:
                    OFF</button>
                <button class="btn-ui skin-btn active" onclick="setSkin('default', this)">Neon</button>
                <button class="btn-ui skin-btn" onclick="setSkin('diamond', this)">Gold</button>
                <button class="btn-ui skin-btn" onclick="setSkin('aether', this)">Aether</button>
                <button class="btn-ui skin-btn" onclick="setSkin('fairy', this)">Red</button>
            </div>
        </div>

        <div class="stats-bar">
            <div class="stat-item"><span style="font-size: 0.6rem; color: #666;" data-i18n="target">ALVO</span><br><span
                    id="target-num" class="stat-val" style="color: var(--primary)">1</span></div>
            <div class="stat-item"><span style="font-size: 0.6rem; color: #666;"
                    data-i18n="accuracy">PRECISÃO</span><br><span id="acc-val" class="stat-val">100%</span></div>
            <div class="stat-item"><span style="font-size: 0.6rem; color: #666;" data-i18n="time">TEMPO</span><br><span
                    id="timer-display" class="stat-val">45.00</span></div>
        </div>

        <div class="grid-container">
            <div id="main-grid" class="grid grid-5"></div>
        </div>

        <div class="footer-btns">
            <button id="start-game-btn" class="btn-main" data-i18n="startMission">Iniciar Missão</button>
            <button id="reset-game-btn" class="btn-main btn-reset" onclick="resetGame()">
                <div class="btn-restart-icon"></div> <span data-i18n="restart">Reiniciar</span>
            </button>
        </div>
    </div>

    <!-- RESULTADOS -->
    <div id="res-overlay" class="overlay">
        <h2 id="res-title" style="font-size: 2.5rem; margin-bottom: 10px;" data-i18n="missionComplete">MISSÃO COMPLETA
        </h2>
        <div class="stat-val" style="margin-bottom: 20px;"><span data-i18n="time">Tempo</span>: <span
                id="final-time">--</span> | <span data-i18n="accuracy">Precisão</span>: <span id="final-acc">--</span>
        </div>
        <div id="fail-txt" style="color: var(--error); font-weight: 900; margin-bottom: 25px; display: none;"
            data-i18n="reproved">⚠️
            REPROVADO: PRECISÃO ABAIXO DE 96%</div>
        <div style="display: flex; gap: 15px; flex-wrap: wrap; justify-content: center;">
            <button onclick="handleRetry()" class="btn-main" data-i18n="again">De Novo</button>
            <button id="next-lv-btn" onclick="advanceLevelWithAd()" class="btn-main"
                style="background: #ffd700; color: #000; display: none;" data-i18n="nextRank">Próxima Patente
                (Ad)</button>
            <button onclick="window.location.href='training_hub.html'" class="btn-main"
                style="background: rgba(255,255,255,0.1); color: #fff;" data-i18n="exit">Sair</button>
            <div id="ranking-container" style="width: 100%; max-width: 400px; margin-top: 20px;"></div>
        </div>
    </div>

    <div id="ad-box" class="overlay" style="z-index: 300; background: #000;">
        <h3 style="letter-spacing: 2px;" data-i18n="unlocking">DESBLOQUEANDO NÍVEL...</h3>
        <p style="color: #666; font-size: 0.8rem; margin-top: 5px;" data-i18n="waitVideo">Assista para liberar por 24h
        </p>
        <div class="ad-timer" id="ad-count">15</div>
        <div style="border: 1px dashed #333; padding: 10px; font-size: 0.7rem; color: #444;" data-i18n="adSimulation">[
            REWARD ADS SIMULATION ]
        </div>
    </div>

    <script src="ranking-system.js"></script>
    <script>
        const AudioCtx = window.AudioContext || window.webkitAudioContext;
        let actx;
        function getCtx() { if (!actx) actx = new AudioCtx(); return actx; }
        function playSnd(f, d, v) { try { const c = getCtx(); if (c.state === 'suspended') c.resume(); const o = c.createOscillator(); const g = c.createGain(); o.connect(g); g.connect(c.destination); o.type = 'sine'; o.frequency.setValueAtTime(f, c.currentTime); g.gain.setValueAtTime(v, c.currentTime); g.gain.exponentialRampToValueAtTime(0.01, c.currentTime + d); o.start(); o.stop(c.currentTime + d); } catch (e) { } }
        const snds = { tap: () => playSnd(600, 0.1, 0.06), fail: () => playSnd(200, 0.2, 0.1), win: () => { playSnd(450, 0.3, 0.04); setTimeout(() => playSnd(750, 0.3, 0.04), 120) }, tick: () => playSnd(1000, 0.05, 0.02) };

        const gridEl = document.getElementById('main-grid');
        const timerEl = document.getElementById('timer-display');
        const startBtn = document.getElementById('start-game-btn');
        startBtn.onclick = startGame;
        const resetBtn = document.getElementById('reset-game-btn');
        const resOverlay = document.getElementById('res-overlay');
        const adBox = document.getElementById('ad-box');

        let gridSize = 5; let nextVal = 1; let timeLeft = 45; let hits = 0; let misses = 0; let interval; let isPlaying = false;
        let smokeOn = false; let flashOn = false;
        let resetCounter = 0;

        function updateLocks() { [7, 9, 11].forEach(lv => { const unt = localStorage.getItem('slx_unlock_v2_' + lv) || 0; const btn = document.getElementById('lock-' + lv); if (Date.now() < unt) btn.classList.remove('locked'); else btn.classList.add('locked'); }); }
        updateLocks();

        function showAd(callback) {
            callback();
        }

        function tryUnlock(s, b) {
            const unt = localStorage.getItem('slx_unlock_v2_' + s) || 0;
            if (Date.now() < unt) { setDiff(s, b); return; }
            if (isPlaying) resetGame();
            showAd(() => {
                localStorage.setItem('slx_unlock_v2_' + s, Date.now() + (24 * 60 * 60 * 1000));
                updateLocks(); setDiff(s, b);
            });
        }

        function handleRetry() {
            resetCounter++;
            if (resetCounter >= 5) {
                resetCounter = 0;
                showAd(() => startGame());
            } else {
                startGame();
            }
        }

        function advanceLevelWithAd() {
            const nextMap = { 3: 5, 5: 7, 7: 9, 9: 11 };
            if (!nextMap[gridSize]) return;
            const nextLv = nextMap[gridSize];
            showAd(() => {
                localStorage.setItem('slx_unlock_v2_' + nextLv, Date.now() + (24 * 60 * 60 * 1000));
                updateLocks();
                setDiff(nextLv, document.getElementById('lock-' + nextLv));
                startGame();
            });
        }
        function setSkin(s, b) { if (isPlaying) resetGame(); document.body.className = `skin-${s}${smokeOn ? ' smoke-active' : ''}${flashOn ? ' flash-active' : ''}`; document.querySelectorAll('.skin-btn').forEach(x => x.classList.remove('active')); b.classList.add('active'); snds.tap(); }

        function toggleSmoke(b) {
            smokeOn = !smokeOn; b.classList.toggle('active');
            b.textContent = smokeOn ? getT('smokeMode') + ": ON" : getT('smokeMode') + ": OFF";
            document.body.classList.toggle('smoke-active');
            snds.tap();
        }

        function toggleFlash(b) {
            flashOn = !flashOn; b.classList.toggle('active');
            b.textContent = flashOn ? getT('flashMode') + ": ON" : getT('flashMode') + ": OFF";
            document.body.classList.toggle('flash-active');
            snds.tap();
        }

        function setDiff(s, b) {
            if (isPlaying) resetGame();
            gridSize = s;
            document.querySelectorAll('.diff-btn').forEach(x => x.classList.remove('active'));
            b.classList.add('active');
            gridEl.className = `grid grid-${s}`;
            const times = { 3: 15, 5: 45, 7: 120, 9: 210, 11: 330 };
            timeLeft = times[s];
            timerEl.textContent = timeLeft.toFixed(2);
            initGrid();
            snds.tap();
        }

        function updateTime() {
            timeLeft -= 0.01;
            if (timeLeft <= 0) {
                timeLeft = 0;
                endGame(false);
            }
            if (timeLeft < 10) {
                timerEl.classList.add('warning');
                if (Math.round(timeLeft * 10) % 10 === 0) snds.tick();
            } else {
                timerEl.classList.remove('warning');
            }
            timerEl.textContent = Math.abs(timeLeft).toFixed(2);
        }

        function resetGame() {
            isPlaying = false;
            clearInterval(interval);
            startBtn.style.display = 'inline-block';
            startBtn.textContent = getT('startMission');
            resetBtn.style.display = 'none';
            initGrid();
            nextVal = 1; hits = 0; misses = 0;
            document.getElementById('target-num').textContent = '1';
            document.getElementById('acc-val').textContent = '100%';
            const times = { 3: 15, 5: 45, 7: 120, 9: 210, 11: 330 };
            timeLeft = times[gridSize];
            timerEl.textContent = timeLeft.toFixed(2);
            timerEl.classList.remove('warning');
            snds.fail();
        }

        function endGame(done) {
            isPlaying = false;
            clearInterval(interval);
            resOverlay.style.display = 'flex';
            const acc = Math.round((hits / (hits + misses || 1)) * 100);
            const success = done && acc >= 96;

            document.getElementById('final-time').textContent = done ? `${timeLeft.toFixed(2)}s` : "ESGOTADO";
            document.getElementById('final-acc').textContent = `${acc}%`;

            const title = document.getElementById('res-title');
            const failMsg = document.getElementById('fail-txt');

            if (success) {
                snds.win();
                title.textContent = getT('missionComplete');
                title.style.color = "var(--success)";
                failMsg.style.display = 'none';
                if (gridSize < 11) document.getElementById('next-lv-btn').style.display = 'block';
                else document.getElementById('next-lv-btn').style.display = 'none';
            } else {
                snds.fail();
                title.textContent = getT('reproved');
                title.style.color = "var(--error)";
                failMsg.style.display = 'block';
                failMsg.textContent = getT('reproved');
                document.getElementById('next-lv-btn').style.display = 'none';
            }

            // ATUALIZAR RANKING
            const gameId = 'schulte_challenge';
            if (success) {
                const finalScoreValue = (gridSize * gridSize * 10) + Math.round(timeLeft * 5);
                const user = prompt("SENSACIONAL! Digite seu nome para o Ranking:", "Elite");
                if (user) {
                    RankingSystem.submitScore(gameId, user, finalScoreValue).then(() => {
                        RankingSystem.fetchTopRanks(gameId).then(data => {
                            RankingSystem.renderLeaderboard('ranking-container', data, getT('title'));
                        });
                    });
                } else {
                    RankingSystem.fetchTopRanks(gameId).then(data => {
                        RankingSystem.renderLeaderboard('ranking-container', data, getT('title'));
                    });
                }
            } else {
                RankingSystem.fetchTopRanks(gameId).then(data => {
                    RankingSystem.renderLeaderboard('ranking-container', data, getT('title'));
                });
            }
        }

        function cellClick(e) {
            if (!isPlaying) return;
            const n = parseInt(e.target.dataset.num);
            if (n === nextVal) {
                hits++;
                snds.tap();
                e.target.classList.add('correct');
                nextVal++;
                if (nextVal > gridSize * gridSize) endGame(true);
                else document.getElementById('target-num').textContent = nextVal;
            } else {
                misses++;
                snds.fail();
                e.target.classList.add('wrong');
                setTimeout(() => e.target.classList.remove('wrong'), 200);
            }
            document.getElementById('acc-val').textContent = `${Math.round((hits / (hits + misses || 1)) * 100)}%`;
        }

        function startGame() {
            try { getCtx().resume().catch(() => { }); } catch (e) { }
            resOverlay.style.display = 'none';
            gridEl.innerHTML = '';
            nextVal = 1; hits = 0; misses = 0;
            const times = { 3: 15, 5: 45, 7: 120, 9: 210, 11: 330 };
            timeLeft = times[gridSize];
            isPlaying = true;

            const nums = Array.from({ length: gridSize * gridSize }, (_, i) => i + 1).sort(() => Math.random() - 0.5);
            nums.forEach(n => {
                const c = document.createElement('div');
                c.className = 'cell';
                c.textContent = n;
                c.dataset.num = n;
                c.onclick = cellClick;
                gridEl.appendChild(c);
            });

            clearInterval(interval);
            interval = setInterval(updateTime, 10);
            startBtn.style.display = 'none';
            resetBtn.style.display = 'inline-flex';
            snds.tap();
            document.getElementById('target-num').textContent = '1';
            document.getElementById('acc-val').textContent = '100%';
        }

        function initGrid() {
            gridEl.innerHTML = '';
            for (let i = 0; i < gridSize * gridSize; i++) {
                const c = document.createElement('div');
                c.className = 'cell';
                c.style.opacity = '0.2';
                c.textContent = '?';
                gridEl.appendChild(c);
            }
            startBtn.style.display = 'inline-block';
        }

        function getT(key) {
            const lang = localStorage.getItem('slx_language') || 'pt'; // KEY CORRIGIDA
            return (translations[lang] || translations.pt)[key];
        }

        function applyLanguage() {
            const lang = localStorage.getItem('slx_language') || 'pt';
            const t = translations[lang] || translations.pt;

            document.querySelectorAll('[data-i18n]').forEach(el => {
                const key = el.getAttribute('data-i18n');
                if (t[key]) el.textContent = t[key];
            });

            // Toggle buttons
            document.getElementById('smoke-btn').textContent = smokeOn ? t.smokeMode + ": ON" : t.smokeMode + ": OFF";
            document.getElementById('flash-btn').textContent = flashOn ? t.flashMode + ": ON" : t.flashMode + ": OFF";

            if (document.getElementById('btn-nav-home')) document.getElementById('btn-nav-home').textContent = t.home;
            if (document.getElementById('btn-nav-hub')) document.getElementById('btn-nav-hub').textContent = t.hub;

        RankingSystem.fetchTopRanks('schulte_challenge').then(data => {
